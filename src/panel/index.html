<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANAマイルナビ</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <header>
      <h1><img src="../../icons/icon48.png" alt="" class="brand-icon" />ANAマイルナビ</h1>
      <nav class="tabs">
        <button data-tab="search" class="active">検索</button>
        <button data-tab="results">結果</button>
      </nav>
    </header>

    <!-- 検索条件 -->
    <section id="tab-search" class="tab-panel active">
      <form id="sweep-form">
        <div class="row">
          <label>出発空港
            <select name="depart" id="depart-select" required></select>
          </label>
          <label>目的地（複数追加できます）
            <span class="destPick">
              <select id="dest-select"></select>
              <button type="button" id="btn-add-dest" title="目的地リストに追加">＋追加</button>
            </span>
          </label>
        </div>
        <ul id="dest-chips" class="chips"></ul>
        <p id="airport-note" class="note">空港候補は代表例です。ANAの検索ページを一度開くと、ANAと同じ全空港リストに切り替わります。</p>
        <div class="row">
          <label>期間開始 <input type="date" name="periodStart" required /></label>
          <label>期間終了 <input type="date" name="periodEnd" required /></label>
        </div>
        <fieldset>
          <legend>出発曜日 (未選択で全曜日)</legend>
          <label><input type="checkbox" name="wd" value="0" />日</label>
          <label><input type="checkbox" name="wd" value="1" />月</label>
          <label><input type="checkbox" name="wd" value="2" />火</label>
          <label><input type="checkbox" name="wd" value="3" />水</label>
          <label><input type="checkbox" name="wd" value="4" />木</label>
          <label><input type="checkbox" name="wd" value="5" />金</label>
          <label><input type="checkbox" name="wd" value="6" />土</label>
        </fieldset>
        <div class="row">
          <label>復路便（出発便から何日後）
            <input type="number" name="returnOffsetDays" value="3" min="0" max="30" required />
          </label>
        </div>
        <fieldset>
          <legend>座席クラス (複数選択可)</legend>
          <label><input type="checkbox" name="cabin" value="ECONOMY" checked />エコノミー</label>
          <label><input type="checkbox" name="cabin" value="PREMIUM_ECONOMY" />プレエコ</label>
          <label><input type="checkbox" name="cabin" value="BUSINESS" />ビジネス</label>
          <label><input type="checkbox" name="cabin" value="FIRST" />ファースト</label>
        </fieldset>
        <p id="estimate" class="estimate"></p>
        <p class="note">
          国際線は旧エンジンの結果ページをめくる方式です。<b>ANAで国際線特典の往復空席照会を1回行い、
          結果一覧ページを開いた状態</b>でスイープを開始してください。各日付の検索ごとにページが
          再読込され、便・必要マイル・燃油・空席が自動で一覧に追記されます（サイドパネルは開いたままに）。
        </p>
        <div class="controls">
          <button type="submit" id="btn-start">検索開始</button>
          <button type="button" id="btn-pause" disabled>一時停止</button>
          <button type="button" id="btn-resume" disabled>再開</button>
          <button type="button" id="btn-cancel" disabled>中止</button>
        </div>
      </form>
      <div id="progress" class="progress"></div>
    </section>

    <!-- 結果 -->
    <section id="tab-results" class="tab-panel">
      <div class="import-bar">
        <button id="btn-import-page">現在のANA結果ページを取り込む</button>
        <span class="note">旧国際線エンジンの結果ページを開いた状態で押すと、便・必要マイル・燃油・空席を一覧化します。</span>
      </div>
      <div class="filters">
        <label>運航
          <select id="f-operator">
            <option value="all">すべて</option>
            <option value="ANA">ANAのみ</option>
            <option value="PARTNER">提携のみ</option>
          </select>
        </label>
        <label>キャビン
          <select id="f-cabin">
            <option value="all">すべて</option>
            <option value="ECONOMY">エコノミー</option>
            <option value="PREMIUM_ECONOMY">プレエコ</option>
            <option value="BUSINESS">ビジネス</option>
            <option value="FIRST">ファースト</option>
          </select>
        </label>
        <label>最大マイル <input type="number" id="f-maxmiles" placeholder="上限なし" min="0" /></label>
        <label><input type="checkbox" id="f-waitlist" /> 空席待ちを除外</label>
        <button id="btn-csv">CSV出力</button>
        <button id="btn-clear">結果クリア</button>
      </div>
      <div id="results"></div>
    </section>

    <script type="module" src="./panel.ts"></script>
  </body>
</html>
